version: 2
updates:
  # Go (go.mod)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    allow:
      - dependency-type: "all"
    open-pull-requests-limit: 10
    groups:
      go-dependencies:
        patterns:
          - "*"
